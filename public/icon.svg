<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ritme">
  <!--
    Ritme icon source: cycle segment strip + accent line (DESIGN.md).
    Colors = tokens in src/styles/tokens.css, flat fills only.
    PNGs are derived from this file with inkscape (export png, width 192 and 512).
    The glyph is scaled to 75% (translate 8 8 then scale 0.75) to fit the maskable safe
    zone (80% circle at the center): one file for both the regular and maskable icons.
  -->
  <rect width="64" height="64" rx="8" fill="#f2eee6" />
  <g transform="translate(8 8) scale(0.75)">
    <rect x="12" y="8" width="40" height="4" fill="#a8441f" />
    <g fill="#1b1a17">
      <rect x="12" y="40" width="10" height="12" />
      <rect x="27" y="30" width="10" height="22" />
      <rect x="42" y="20" width="10" height="32" />
    </g>
  </g>
</svg>
